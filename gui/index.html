<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>無人機自動建圖巡航系統</title>
<style>
:root{--bg:#0f1720;--panel:#17212c;--line:#263445;--fg:#e6edf3;--mut:#8b9bb0;--acc:#3aa0ff;--ok:#3fb950;--warn:#d29922;--err:#f85149}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,"Noto Sans CJK TC","PingFang TC",sans-serif}
header{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}
header h1{font-size:20px;margin:0}header small{color:var(--mut)}
nav{display:flex;gap:4px;padding:0 22px;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;color:var(--mut);padding:10px 16px;cursor:pointer;font:inherit;border-bottom:2px solid transparent}
nav button.on{color:var(--fg);border-color:var(--acc)}
main{padding:20px 22px;display:grid;grid-template-columns:minmax(340px,440px) 1fr;gap:20px}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.card h2{margin:0 0 12px;font-size:15px}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:12px}
input[type=text],textarea,select{width:100%;background:#0d141c;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit}
textarea{min-height:90px;resize:vertical;font-family:ui-monospace,monospace;font-size:12px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>button{flex:0 0 auto}
button.btn{background:var(--acc);color:#04121f;border:0;border-radius:6px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
button.btn.sec{background:#243447;color:var(--fg)}button.btn.danger{background:var(--err);color:#fff}
button.btn:disabled{opacity:.5;cursor:not-allowed}
.eng{display:grid;gap:8px}.eng label{margin:0;border:1px solid var(--line);border-radius:6px;padding:10px;color:var(--fg);cursor:pointer;font-size:13px}
.eng label.sel{border-color:var(--acc);background:#112033}.eng small{display:block;color:var(--mut)}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;background:#243447}
.queued,.running{color:var(--warn)}.done{color:var(--ok)}.failed,.stopped,.interrupted{color:var(--err)}
#jobs{display:grid;gap:6px;max-height:300px;overflow:auto}
.job{padding:8px 10px;border:1px solid var(--line);border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.job.sel{border-color:var(--acc);background:#112033}.job small{color:var(--mut)}
pre#log{background:#080d13;border:1px solid var(--line);border-radius:6px;padding:10px;height:300px;overflow:auto;font:12px/1.45 ui-monospace,monospace;white-space:pre-wrap;margin:0}
table{border-collapse:collapse;width:100%}td,th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
.path{font-family:ui-monospace,monospace;font-size:12px;color:var(--mut);word-break:break-all}
.hint{color:var(--mut);font-size:12px;margin-top:6px}.err{color:var(--err)}
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;width:min(640px,92vw);padding:0}
dialog::backdrop{background:#0008}dialog .hd{padding:12px 16px;border-bottom:1px solid var(--line)}
#bl{max-height:50vh;overflow:auto;padding:6px 10px}#bl div{padding:5px 6px;cursor:pointer;border-radius:4px}#bl div:hover{background:#112033}
dialog .ft{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
svg{background:#080d13;border:1px solid var(--line);border-radius:6px;width:100%;height:360px}
.legend span{margin-right:14px;font-size:12px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.hidden{display:none!important}
</style>
</head>
<body>
<header><h1>無人機自動建圖巡航系統</h1><small id="sub"></small></header>
<nav><button data-tab="map" class="on">建圖</button><button data-tab="cruise">巡航定位</button></nav>

<main>
<section>
  <div class="card" id="p-map">
    <h2>建立地圖</h2>
    <div class="eng" id="eng-map"></div>
    <label>任務名稱</label><input type="text" id="m-name" value="site">
    <label>影片（資料夾或檔案，每行一個）</label>
    <textarea id="m-videos" placeholder="/path/to/videos"></textarea>
    <div class="row"><button class="btn sec" onclick="openBrowse('m-videos',true)">瀏覽…</button><span class="hint" id="m-hint"></span></div>
    <label>輸出資料夾</label><input type="text" id="m-out">
    <label>相機標定檔（選填，無畸變 PINHOLE JSON）</label>
    <div class="row"><input type="text" id="m-intr" placeholder="留空：moge3 版用近似自動標定；原始版用內建相機">
      <button class="btn sec" onclick="openBrowse('m-intr',false,true)">瀏覽…</button></div>
    <div id="m-moge" class="row" style="margin-top:10px"><label style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" id="m-nodense" style="width:auto"> 略過稠密化</label></div>
    <div style="margin-top:14px"><button class="btn" id="m-go" onclick="startMap()">開始建圖</button></div>
    <div class="err" id="m-err"></div>
  </div>

  <div class="card hidden" id="p-cruise">
    <h2>巡航定位</h2>
    <div class="eng" id="eng-cruise"></div>
    <label>已完成的地圖</label><select id="c-pick" onchange="pickMap()"></select>
    <label>地圖資料夾（moge3：含 localization/bundle；原始版：含 run/）</label>
    <div class="row"><input type="text" id="c-map"><button class="btn sec" onclick="openBrowse('c-map',false)">瀏覽…</button></div>
    <label>巡航影片</label>
    <div class="row"><input type="text" id="c-video"><button class="btn sec" onclick="openBrowse('c-video',false,true)">瀏覽…</button></div>
    <label>航線名稱</label><input type="text" id="c-route" placeholder="預設：影片檔名">
    <div style="margin-top:14px"><button class="btn" onclick="startCruise()">開始巡航定位</button></div>
    <div class="err" id="c-err"></div>
  </div>

  <div class="card" style="margin-top:16px"><h2>任務</h2><div id="jobs"></div></div>
</section>

<section>
  <div class="card">
    <h2 id="jt">尚未選擇任務</h2>
    <div id="jmeta" class="hint"></div>
    <div style="margin:10px 0"><button class="btn danger hidden" id="stop" onclick="stopJob()">停止</button></div>
    <div id="result"></div>
    <pre id="log"></pre>
  </div>
</section>
</main>

<dialog id="dlg"><div class="hd"><b>選擇路徑</b> <span class="path" id="bp"></span></div><div id="bl"></div>
<div class="ft"><button class="btn sec" onclick="dlg.close()">取消</button><button class="btn" id="bsel" onclick="confirmBrowse()">選取目前資料夾</button></div></dialog>

<script>
const $=id=>document.getElementById(id);
const api=(p,o)=>fetch(p,o).then(async r=>{const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j});
const post=(p,b)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
let cfg,eng='moge3',selJob=null,logOff=0,tab='map',bt={};
const STATUS={queued:'排隊中',running:'執行中',done:'完成',failed:'失敗',stopped:'已停止',interrupted:'已中斷'};
const COL={RELOC_SEED:'#3fb950',FAST_TRACK:'#3aa0ff',VO_ONLY:'#d29922',DEAD_RECKON:'#a371f7',NO_POSE:'#f85149'};

function engCards(el){el.innerHTML='';for(const k of ['moge3','original']){const e=cfg.engines[k];
  const l=document.createElement('label');l.className=eng===k?'sel':'';
  l.innerHTML=`<input type="radio" name="e-${el.id}" ${eng===k?'checked':''} style="width:auto"> ${e.label}${e.ready?'':`<small class="err">尚未安裝：${e.hint}</small>`}`;
  l.onclick=()=>{eng=k;engCards($('eng-map'));engCards($('eng-cruise'));upd()};el.appendChild(l)}}
function upd(){$('m-moge').classList.toggle('hidden',eng!=='moge3');
  $('m-hint').textContent=eng==='original'?'原始版：請指定單一影片資料夾':'可指定多個資料夾或影片檔'}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  $('p-map').classList.toggle('hidden',tab!=='map');$('p-cruise').classList.toggle('hidden',tab!=='cruise')});

async function startMap(){$('m-err').textContent='';
  try{const j=await post('/api/jobs',{kind:'map',engine:eng,name:$('m-name').value,videos:$('m-videos').value.split('\n'),
    out:$('m-out').value,intrinsics:$('m-intr').value,skip_dense:$('m-nodense').checked});selJob=j.id;logOff=0;$('log').textContent='';refresh()}
  catch(e){$('m-err').textContent=e.message}}
async function startCruise(){$('c-err').textContent='';
  try{const j=await post('/api/jobs',{kind:'cruise',engine:eng,map:$('c-map').value,video:$('c-video').value,route:$('c-route').value});
    selJob=j.id;logOff=0;$('log').textContent='';refresh()}catch(e){$('c-err').textContent=e.message}}
async function stopJob(){if(selJob)await post(`/api/jobs/${selJob}/stop`,{})}
function pickMap(){const v=$('c-pick').value;if(v)$('c-map').value=v}

async function refresh(){const jobs=await api('/api/jobs');
  $('jobs').innerHTML=jobs.map(j=>`<div class="job ${j.id===selJob?'sel':''}" onclick="sel('${j.id}')"><span>${j.kind==='map'?'建圖':'巡航'} · ${j.title}<br><small>${j.engine} · ${new Date(j.created*1000).toLocaleString()}</small></span><span class="badge ${j.status}">${STATUS[j.status]||j.status}</span></div>`).join('')||'<span class="hint">尚無任務</span>';
  const maps=jobs.filter(j=>j.kind==='map'&&j.status==='done'&&j.engine===eng);
  const cur=$('c-pick').value;$('c-pick').innerHTML='<option value="">（選擇）</option>'+maps.map(j=>`<option value="${j.result_dir}">${j.title} — ${j.result_dir}</option>`).join('');$('c-pick').value=cur;
  if(selJob){const j=jobs.find(x=>x.id===selJob);if(j)await show(j)}}
function sel(id){selJob=id;logOff=0;$('log').textContent='';$('result').innerHTML='';refresh()}
async function show(j){$('jt').textContent=`${j.kind==='map'?'建圖':'巡航定位'}：${j.title}`;
  $('jmeta').innerHTML=`<span class="badge ${j.status}">${STATUS[j.status]||j.status}</span> 引擎 ${j.engine}${j.exit_code!=null?' · 結束碼 '+j.exit_code:''}${j.error?' · '+j.error:''}<br><span class="path">${j.result_dir||''}</span>`;
  $('stop').classList.toggle('hidden',j.status!=='running');
  const l=await api(`/api/jobs/${j.id}/log?offset=${logOff}`);if(l.text){const p=$('log'),bot=p.scrollTop+p.clientHeight>=p.scrollHeight-20;p.textContent+=l.text;logOff=l.offset;if(bot)p.scrollTop=p.scrollHeight}
  if(j.status==='done'||j.status==='failed'||j.status==='stopped'){const r=await api(`/api/jobs/${j.id}/result`);$('result').innerHTML=j.kind==='map'?mapHtml(r):cruiseHtml(r)}}
function mapHtml(r){if(!r.files.length)return'<div class="hint">尚無產出檔案</div>';
  return '<table>'+r.files.map(f=>`<tr><td>${f.label}</td><td class="path">${f.path}</td><td>${f.size}</td></tr>`).join('')+'</table>'}
function cruiseHtml(r){if(!r.ready)return'<div class="hint">尚無定位結果</div>';const s=r.summary;
  const rows=Object.entries(s.status_counts||{}).map(([k,v])=>`<tr><td><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${COL[k]||'#888'};margin-right:6px"></i>${k}</td><td>${v}</td></tr>`).join('');
  return `<table><tr><td>影格數</td><td>${s.dense_frames}</td></tr><tr><td>位姿覆蓋率</td><td>${(s.pose_coverage*100).toFixed(1)}%</td></tr>${rows}</table>
  <div class="hint" style="margin:10px 0 4px">航跡俯視圖（地圖座標 X–Z，非公尺；顏色為定位狀態）</div>${plot(r.points)}`}
function plot(pts){const P=pts.filter(p=>p.p);if(P.length<2)return'<div class="hint">沒有可繪製的位姿</div>';
  const xs=P.map(p=>p.p[0]),zs=P.map(p=>p.p[2]);const x0=Math.min(...xs),x1=Math.max(...xs),z0=Math.min(...zs),z1=Math.max(...zs);
  const W=800,H=360,m=24,sc=Math.min((W-2*m)/Math.max(x1-x0,1e-9),(H-2*m)/Math.max(z1-z0,1e-9));
  const X=x=>m+(x-x0)*sc,Z=z=>H-m-(z-z0)*sc;
  const line=P.map((p,i)=>`${i?'L':'M'}${X(p.p[0]).toFixed(1)},${Z(p.p[2]).toFixed(1)}`).join('');
  const dots=P.map(p=>`<circle cx="${X(p.p[0]).toFixed(1)}" cy="${Z(p.p[2]).toFixed(1)}" r="2.2" fill="${COL[p.s]||'#888'}"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}"><path d="${line}" fill="none" stroke="#3a4a5e" stroke-width="1"/>${dots}</svg>
  <div class="legend">${Object.entries(COL).map(([k,c])=>`<span><i style="background:${c}"></i>${k}</span>`).join('')}</div>`}

/* file browser */
let bTarget=null,bMulti=false,bFile=false,bPath='';
async function openBrowse(target,multi,file){bTarget=target;bMulti=multi;bFile=!!file;await loadDir($(target).value.split('\n').pop()||'');$('dlg').showModal()}
async function loadDir(p){const r=await api('/api/browse?path='+encodeURIComponent(p));bPath=r.path;$('bp').textContent=r.path;
  $('bl').innerHTML=`<div onclick="loadDir('${r.parent.replace(/'/g,"\\'")}')">⬆ ..</div>`+r.entries.map(e=>`<div onclick="${e.dir?`loadDir('${e.path.replace(/'/g,"\\'")}')`:`pickFile('${e.path.replace(/'/g,"\\'")}')`}">${e.dir?'📁':'🎞'} ${e.name}</div>`).join('');
  $('bsel').classList.toggle('hidden',bFile&&!bMulti)}
function put(v){const el=$(bTarget);if(!bMulti){el.value=v;return}const cur=el.value.split('\n').map(s=>s.trim()).filter(Boolean);if(!cur.includes(v))cur.push(v);el.value=cur.join('\n')}
function pickFile(p){put(p);$('dlg').close()}
function confirmBrowse(){put(bPath);$('dlg').close()}
const dlg=$('dlg');

(async()=>{cfg=await api('/api/config');$('sub').textContent=cfg.repo;$('m-out').value=cfg.default_out;
  eng=cfg.engines.moge3.ready||!cfg.engines.original.ready?'moge3':'original';
  engCards($('eng-map'));engCards($('eng-cruise'));upd();refresh();setInterval(refresh,2000)})();
</script>
</body>
</html>
