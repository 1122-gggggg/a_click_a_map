# All numeric gates are labeled heuristic. They are conservative engineering
# defaults, not fitted site parameters. Missing metric → fail-closed (never invent STRONG).
# Do not treat these as empirical score cutoffs. No site video IDs or map paths.

# Phase A: video/retrieval signals may PROPOSE where to spend geometry.
# Nothing in this section authorizes an SfM merge.
prebuild:
  motion_interval_seconds: 0.5
  relative_admission: true              # rank the available cohort; do not empty it with QA gates
  relative_quality_weight: 0.65         # cohort percentile contribution
  absolute_quality_weight: 0.35         # observed quality remains a diagnostic prior
  relative_marginal_keep_ratio: 0.25    # stop after a cohort-relative marginal-gain collapse
  min_video_score: 0.35                 # legacy/reference score, not a default eligibility gate
  min_marginal_gain: 0.15               # legacy config retained for backward compatibility
  min_base_sessions: 2                  # heuristic when >=2 usable videos exist
  max_sessions: null                    # optional hard proposal budget
  max_no_graph_sessions: 3              # heuristic cap when no retrieval graph exists
  validation_candidates: 1              # reserve untouched candidates when possible
  allow_weak_video_candidates: false    # fail closed by default
  sharpness_reference: 100.0            # heuristic normalization only
  min_parallax_ratio_for_usable: 0.20   # includes discounted low-parallax support below
  low_parallax_credit: 0.35             # low parallax is evidence, but weaker than parallax
  max_degenerate_ratio_for_usable: 0.70
  max_fast_motion_ratio_for_usable: 0.45
  max_near_duplicate_ratio_for_usable: 0.75
  max_bad_exposure_ratio_for_usable: 0.75
  max_epipolar_outlier_ratio_for_usable: 0.75
  video_weights:
    internal_quality: 0.20
    parallax: 0.25
    sharpness: 0.15
    motion_evidence: 0.10
    non_duplicate: 0.10
    exposure: 0.10
    epipolar_consistency: 0.10
  weights:
    video_quality: 0.45
    bridgeability: 0.25
    graph_coverage: 0.15
    motion_diversity: 0.10
    appearance_diversity: 0.05
    triplet_support: 0.10
    multi_link: 0.10
    risk: 0.20
    frame_cost: 0.05
    redundancy: 0.10

# Phase B: only geometrically verified edges can enter the actual Base.
selection:
  max_base_sessions: null
  max_total_tracks: null
  max_total_observations: null
  max_tracks_per_session: null
  min_information_gain: 0.02   # heuristic
  min_coverage_gain: 0.02      # heuristic
  min_independent_bridges_for_strong_edge: 2  # heuristic; fail-closed independent support
  min_redundant_usable_edges_for_cycle: 1     # heuristic
  weights:
    coverage: 1.0        # heuristic
    quality: 1.0         # heuristic
    connectivity: 1.0    # heuristic
    redundancy: 1.0      # heuristic
    information: 1.0     # heuristic
    view_diversity: 0.5  # heuristic
    track_cost: 0.5      # heuristic
    risk: 1.5            # heuristic; prefer fail-closed over track-greedy merge

internal_status:
  # heuristic gates; missing metric → fail toward WEAK/REJECT, never invent STRONG
  reject_registered_ratio_below: 0.5     # heuristic
  reject_positive_depth_below: 0.9       # heuristic
  weak_parallax_p10_deg: 1.0             # heuristic
  inconsistent_cycle_error_deg: 5.0      # heuristic
  reject_sharpness_p10_below: 15.0       # heuristic; Laplacian variance
  usable_registered_ratio_below: 0.8     # heuristic
  strong_requires_reprojection: true     # heuristic fail-closed
  strong_requires_parallax: true         # heuristic fail-closed
  contaminated_map_max_status: WEAK      # heuristic fail-closed

edge:
  # VPR / retrieval is NEVER a geometric edge. Candidates only.
  # STRONG/USABLE require exact-pair independent artifact, group-disjoint
  # fit/holdout, and complete finite geometry. Shared-map tracks stay WEAK.
  min_cross_tracks_for_verified: 30      # heuristic
  min_verified_pairs_for_usable: 8       # heuristic
  max_rotation_consensus_deg: 5.0        # heuristic
  max_translation_dir_consensus_deg: 15.0  # heuristic
  max_scale_consensus_rel: 0.15          # heuristic
  max_cross_reproj_px: 5.0               # heuristic
  min_bridge_parallax_deg: 1.0           # heuristic
  min_positive_depth_ratio: 0.9          # heuristic
  min_spatial_coverage: 0.1              # heuristic
  min_holdout_inlier_ratio: 0.45         # heuristic
  max_holdout_residual_px: 8.0           # heuristic
  query_frame_separation: 30             # heuristic
  reference_frame_separation: 30         # heuristic
  reference_center_separation: 2.0       # heuristic scene units
  holdout_fraction: 0.2                  # heuristic explicit 80/20; never fit+validate on same points
  max_relative_sim3_residual: 0.05       # heuristic
  require_exact_pair_scope: true         # fail-closed invariant
  require_group_disjoint_holdout: true   # fail-closed invariant
  require_complete_geometry: true        # fail-closed invariant
image_qa:
  sharpness_sample_limit: 32             # heuristic
  underexposure_mean: 20.0               # heuristic 8-bit mean
  overexposure_mean: 235.0               # heuristic 8-bit mean
  near_duplicate_hist_corr: 0.995        # heuristic consecutive-frame correlation
  blur_variance_reject: 25.0             # heuristic Laplacian variance

influence:
  # Offline contrast only. Do not treat this as a live leave-one-out authority.
  high_reproj_delta: 1.0                 # heuristic px
  high_became_high_reproj: 10            # heuristic image count
  high_influence_requires_evidence: true
